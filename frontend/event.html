<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8502a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АфишаКолыма">
<title>Событие — АфишаКолыма</title>
<script>try{if(JSON.parse(localStorage.getItem('theme'))==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="css/main.css">
<style>
  .event-hero {
    height: 420px; position: relative; overflow: hidden;
    background: var(--hero-bg);
  }
  .event-hero img { width:100%; height:100%; object-fit:cover; opacity:.6; }
  .event-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(26,23,20,.9) 0%, transparent 60%);
    display: flex; align-items: flex-end; padding: 40px;
  }
  .event-hero-content { color: #fff; max-width: 800px; }
  .event-hero-tag {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(200,80,42,.8); color: #fff; margin-bottom: 12px;
  }
  .event-hero-title {
    font-family: var(--font-display); font-size: 2.6rem; font-weight: 700;
    line-height: 1.15; margin-bottom: 12px;
  }
  .event-hero-meta { display: flex; gap: 20px; flex-wrap: wrap; color: rgba(255,255,255,.7); font-size: 0.9rem; }
  .event-hero-meta span { display: flex; align-items: center; gap: 6px; }

  .event-body {
    max-width: 1100px; margin: 0 auto; padding: 40px 32px;
    display: grid; grid-template-columns: 1fr 340px; gap: 40px;
  }
  @media(max-width:800px) { .event-body { grid-template-columns:1fr; } }

  .event-section { margin-bottom: 36px; }
  .event-section-title {
    font-family: var(--font-display); font-size: 1.3rem; font-weight: 700;
    margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1.5px solid var(--border);
  }
  .event-desc { color: var(--muted); line-height: 1.8; font-size: 0.95rem; }

  /* Sidebar */
  .sidebar-card {
    background: var(--surface); border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: var(--radius); padding: 24px; position: sticky; top: 84px;
  }
  .sidebar-price {
    font-family: var(--font-display); font-size: 2rem; font-weight: 700;
    color: var(--accent); margin-bottom: 4px;
  }
  .sidebar-price-sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; }
  .sidebar-info { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .sidebar-row { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; }
  .sidebar-row-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
  .sidebar-row-label { color: var(--muted); font-size: 0.75rem; }
  .sidebar-row-val { font-weight: 600; }

  /* Reviews */
  .review-item {
    padding: 16px; background: var(--surface2); border-radius: var(--radius-sm);
    border: 1px solid var(--border); border-left: 3px solid var(--accent2); margin-bottom: 12px;
    transition: border-left-color .2s;
  }
  .review-item:hover { border-left-color: var(--accent); }
  .review-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .review-author { font-weight: 600; font-size: 0.88rem; }
  .review-date { font-size: 0.75rem; color: var(--muted); }
  .review-text { font-size: 0.88rem; color: var(--muted); line-height: 1.7; }

  /* Add review */
  .review-form { background: var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-top:20px; }
  .rating-picker { display:flex; gap:6px; margin-bottom:12px; }
  .rating-star { font-size:1.8rem; cursor:pointer; color:var(--border); transition:transform .15s, color .15s; }
  .rating-star:hover { transform: scale(1.2); }
  .rating-star.active { color:#f0b429; text-shadow: 0 0 8px rgba(240,180,41,.4); }
</style>
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div id="event-hero">
  <div class="loader"><div class="spinner"></div> Загрузка...</div>
</div>

<div class="event-body" id="event-body" style="display:none">
  <div>
    <!-- ОПИСАНИЕ -->
    <div class="event-section">
      <div class="event-section-title">О событии</div>
      <div class="event-desc" id="event-desc"></div>
    </div>

    <!-- ОТЗЫВЫ -->
    <div class="event-section">
      <div class="event-section-title">Отзывы</div>
      <div id="reviews-list"><div class="loader"><div class="spinner"></div></div></div>

      <div class="review-form" id="review-form" style="display:none">
        <div style="font-weight:700;margin-bottom:12px">Оставить отзыв</div>
        <div class="rating-picker" id="rating-picker">
          <span class="rating-star" data-v="1">★</span>
          <span class="rating-star" data-v="2">★</span>
          <span class="rating-star" data-v="3">★</span>
          <span class="rating-star" data-v="4">★</span>
          <span class="rating-star" data-v="5">★</span>
        </div>
        <textarea class="form-control" id="review-text" rows="3" placeholder="Расскажите о своих впечатлениях..." style="margin-bottom:12px"></textarea>
        <button class="btn btn-primary" onclick="submitReview()">Отправить</button>
      </div>
      <div id="login-prompt" style="display:none;margin-top:16px;text-align:center;color:var(--muted);font-size:.88rem">
        <a href="login.html" style="color:var(--accent);font-weight:600">Войдите</a>, чтобы оставить отзыв
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div>
    <div class="sidebar-card" id="sidebar"></div>
  </div>
</div>

<div id="site-footer"></div>
<div id="toast"></div>
<script src="js/main.js?v=3"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
let selectedRating = 0;
let eventData = null;

// Rating picker
document.querySelectorAll('.rating-star').forEach(s => {
  s.addEventListener('click', () => {
    selectedRating = +s.dataset.v;
    document.querySelectorAll('.rating-star').forEach((x,i) => x.classList.toggle('active', i < selectedRating));
  });
});

async function init() {
  if (!id) { document.getElementById('event-hero').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Событие не найдено</div>'; return; }
  try {
    eventData = await get('/events/' + id);
    renderHero(eventData);
    renderBody(eventData);
    loadReviews();
    document.getElementById('event-body').style.display = '';
    if (auth.isLoggedIn() && auth.type() === 'user') document.getElementById('review-form').style.display = '';
    else document.getElementById('login-prompt').style.display = '';
  } catch(e) { document.getElementById('event-hero').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>' + e.message + '</div>'; }
}

function renderHero(e) {
  document.title = e.title + ' — АфишаКолыма';
  document.getElementById('event-hero').innerHTML = `
    <div class="event-hero">
      ${e.image ? `<img src="${e.image}" alt="${e.title}">` : '<div style="width:100%;height:100%;background:var(--hero-bg)"></div>'}
      <div class="event-hero-overlay">
        <div class="event-hero-content">
          <span class="event-hero-tag">${e.category_name || 'Событие'}</span>
          <h1 class="event-hero-title">${e.title}</h1>
          <div class="event-hero-meta">
            <span>📅 ${fmtDate(e.start_datetime)}</span>
            <span>🏁 ${fmtDate(e.end_datetime)}</span>
            ${e.venue_name ? `<span>📍 ${e.venue_name}</span>` : ''}
            ${e.age_restriction ? `<span>🔞 ${e.age_restriction}+</span>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderBody(e) {
  document.getElementById('event-desc').textContent = e.description || 'Описание не указано.';

  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-price">${fmtPrice(e.price)}</div>
    <div class="sidebar-price-sub">${+e.price === 0 ? 'Вход свободный' : 'Стоимость билета'}</div>
    <div class="sidebar-info">
      <div class="sidebar-row">
        <span class="sidebar-row-icon">📅</span>
        <div><div class="sidebar-row-label">Начало</div><div class="sidebar-row-val">${fmtDate(e.start_datetime)}</div></div>
      </div>
      <div class="sidebar-row">
        <span class="sidebar-row-icon">🏁</span>
        <div><div class="sidebar-row-label">Окончание</div><div class="sidebar-row-val">${fmtDate(e.end_datetime)}</div></div>
      </div>
      ${e.venue_name ? `
      <div class="sidebar-row">
        <span class="sidebar-row-icon">📍</span>
        <div><div class="sidebar-row-label">Площадка</div>
        <div class="sidebar-row-val"><a href="venue.html?id=${e.venue_id}" style="color:var(--accent)">${e.venue_name}</a></div>
        ${e.venue_address ? `<div style="font-size:.78rem;color:var(--muted)">${e.venue_address}</div>` : ''}
        </div>
      </div>` : ''}
      ${e.organization_name ? `
      <div class="sidebar-row">
        <span class="sidebar-row-icon">🏢</span>
        <div><div class="sidebar-row-label">Организатор</div><div class="sidebar-row-val">${e.organization_name}</div></div>
      </div>` : ''}
      ${e.status_name ? `
      <div class="sidebar-row">
        <span class="sidebar-row-icon">🔖</span>
        <div><div class="sidebar-row-label">Статус</div><div class="sidebar-row-val">${e.status_name}</div></div>
      </div>` : ''}
    </div>
    ${+e.price > 0
      ? `<button class="btn btn-primary btn-full" style="margin-bottom:10px" onclick="addToCart()">🛒 Купить билет</button>`
      : `<button class="btn btn-green btn-full" style="margin-bottom:10px" onclick="addToCart()">🎟️ Получить билет</button>`
    }
    <button class="btn btn-secondary btn-full" style="margin-bottom:8px" onclick="addFav()">♡ В избранное</button>
    <button class="btn btn-secondary btn-full" onclick="exportIcs()">📅 Добавить в календарь</button>
  `;
}

async function loadReviews() {
  const list = document.getElementById('reviews-list');
  try {
    const reviews = await get('/reviews?event_id=' + id);
    if (!reviews.length) { list.innerHTML = '<div class="empty" style="padding:24px"><div class="empty-icon">💬</div>Пока нет отзывов</div>'; return; }
    const myId = auth.type() === 'user' ? auth.user()?.user_id : null;
    list.innerHTML = reviews.map(r => `
      <div class="review-item" id="review-${r.review_id}">
        <div class="review-header">
          <span class="review-author">${escHtml(r.user_name || 'Аноним')}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <span>${stars(r.rating)}</span>
            <span class="review-date">${fmtDateOnly(r.created_at)}</span>
            ${myId && r.user_id == myId ? `<button onclick="deleteReview(${r.review_id})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:2px 6px;border-radius:4px;transition:var(--transition)" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">✕</button>` : ''}
          </div>
        </div>
        <div class="review-text">${escHtml(r.text)}</div>
      </div>
    `).join('');
  } catch(e) { list.innerHTML = ''; }
}

async function deleteReview(reviewId) {
  if (!confirm('Удалить отзыв?')) return;
  try {
    await del('/reviews/' + reviewId);
    document.getElementById('review-' + reviewId)?.remove();
    toast('Отзыв удалён');
  } catch(e) { toast(e.message, 'error'); }
}

async function submitReview() {
  if (!selectedRating) { toast('Выберите оценку', 'error'); return; }
  const text = document.getElementById('review-text').value.trim();
  if (!text) { toast('Напишите отзыв', 'error'); return; }
  try {
    await post('/reviews', { event_id: +id, text, rating: selectedRating });
    toast('Отзыв добавлен!', 'success');
    document.getElementById('review-text').value = '';
    selectedRating = 0;
    document.querySelectorAll('.rating-star').forEach(s => s.classList.remove('active'));
    loadReviews();
  } catch(e) { toast(e.message, 'error'); }
}

async function addToCart() {
  if (!auth.isLoggedIn() || auth.type() !== 'user') { window.location = 'login.html'; return; }
  try {
    await post('/tickets', { event_id: +id, price: eventData?.price ?? 0, quantity: 1 });
    toast('Билет добавлен в корзину!', 'success');
    updateCartBadge();
  } catch(e) { toast(e.message, 'error'); }
}

async function addFav() {
  if (!auth.isLoggedIn()) { window.location = 'login.html'; return; }
  try {
    await post('/favorites', { event_id: +id });
    toast('Добавлено в избранное!', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

function exportIcs() {
  if (!eventData) return;
  const pad = n => String(n).padStart(2, '0');
  const toIcsDate = str => {
    const d = new Date(str);
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  };
  const esc = s => (s || '').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const uid = `event-${eventData.event_id}-${Date.now()}@afishakolyma`;
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//АфишаКолыма//RU',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${toIcsDate(new Date().toISOString())}`,
    `DTSTART:${toIcsDate(eventData.start_datetime)}`,
    `DTEND:${toIcsDate(eventData.end_datetime || eventData.start_datetime)}`,
    `SUMMARY:${esc(eventData.title)}`,
    `DESCRIPTION:${esc(eventData.description)}`,
    eventData.venue_address ? `LOCATION:${esc(eventData.venue_address)}` : '',
    'END:VEVENT',
    'END:VCALENDAR',
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${eventData.title.replace(/[^а-яёa-z0-9]/gi, '_')}.ics`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Файл .ics скачан', 'success');
}

init();
</script>
</body>
</html>
