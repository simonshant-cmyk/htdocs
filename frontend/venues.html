<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8502a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="АфишаКолыма">
<title>Площадки — АфишаКолыма</title>
<script>try{if(JSON.parse(localStorage.getItem('theme'))==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="stylesheet" href="css/main.css">
<style>
  .hero {
    background: var(--hero-bg); color: #fff;
    padding: 72px 32px 56px; text-align: center; position: relative; overflow: hidden;
  }
  .hero::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 20% 50%, rgba(200,80,42,.4) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 30%, rgba(42,110,90,.25) 0%, transparent 50%);
  }
  .hero-content { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }
  .hero-title {
    font-family: var(--font-display); font-size: 3.2rem; font-weight: 700;
    line-height: 1.1; margin-bottom: 14px;
  }
  .hero-title em { font-style: italic; color: rgba(255,255,255,.6); }
  .hero-sub { color: rgba(255,255,255,.6); font-size: 1rem; margin-bottom: 32px; }

  .search-bar {
    display: flex; gap: 10px; background: var(--surface);
    border-radius: 12px; padding: 8px; box-shadow: var(--shadow-lg);
    max-width: 580px; margin: 0 auto;
  }
  .search-bar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 0.95rem; color: var(--text); padding: 6px 8px;
  }
  .search-bar select {
    border: none; outline: none; background: var(--bg2);
    border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; color: var(--text);
    cursor: pointer;
  }

  .filters {
    max-width: 1200px; margin: 32px auto 0; padding: 0 32px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .filter-chip {
    padding: 6px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--muted);
    cursor: pointer; transition: var(--transition);
  }
  .filter-chip:hover, .filter-chip.active {
    border-color: var(--accent); color: var(--accent); background: rgba(200,80,42,.05);
  }
  .filter-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }

  .main-tabs {
    max-width: 1200px; margin: 32px auto 0; padding: 0 32px;
    display: flex; gap: 4px; border-bottom: 1.5px solid var(--border);
  }
  .main-tab {
    padding: 10px 24px; font-size: 0.95rem; font-weight: 700; color: var(--muted);
    cursor: pointer; transition: var(--transition); border-bottom: 2px solid transparent; margin-bottom: -1.5px;
  }
  .main-tab.active { color: var(--text); border-bottom-color: var(--text); }

  .content { max-width: 1200px; margin: 32px auto; padding: 0 32px; }

  .event-card { cursor: pointer; }
  .event-card .card-footer {
    padding: 12px 18px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .fav-btn {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border); background: var(--surface);
    font-size: 1rem; cursor: pointer; transition: var(--transition);
  }
  .fav-btn:hover, .fav-btn.active { border-color: var(--accent); background: rgba(200,80,42,.08); }
</style>
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1 class="hero-title">Найди своё<br><em>событие</em></h1>
    <p class="hero-sub">Концерты, выставки, фестивали и лучшие места города</p>
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Поиск событий и площадок...">
      <select id="search-category">
        <option value="">Все категории</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="doSearch()">Найти</button>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="main-tabs">
  <div class="main-tab active" id="tab-events" onclick="switchTab('events')">🎭 События</div>
  <div class="main-tab" id="tab-venues" onclick="switchTab('venues')">📍 Площадки</div>
</div>

<!-- FILTERS -->
<div class="filters" id="filters-row">
  <span class="filter-label">Категория:</span>
  <div id="category-chips"></div>
</div>

<!-- CONTENT -->
<div class="content">
  <div id="events-grid" class="grid-3"></div>
  <div id="venues-grid" class="grid-3" style="display:none"></div>
</div>

<div id="site-footer"></div>
<div id="toast"></div>
<script src="js/main.js?v=5"></script>
<script>
let currentTab = 'events';
let categories = [];
let activeCategory = null;

async function init() {
  await loadCategories();
  await loadEvents();
}

async function loadCategories() {
  try {
    categories = await get('/categories') || [];
    // category filter chips
    const chips = document.getElementById('category-chips');
    const sel   = document.getElementById('search-category');
    categories.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'filter-chip';
      chip.textContent = c.name;
      chip.onclick = () => toggleCategory(c.id, chip);
      chips.appendChild(chip);

      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  } catch(e) {}
}

function toggleCategory(id, el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  if (activeCategory === id) { activeCategory = null; }
  else { activeCategory = id; el.classList.add('active'); }
  currentTab === 'events' ? loadEvents() : loadVenues();
}

async function loadEvents(search = '') {
  const grid = document.getElementById('events-grid');
  grid.innerHTML = '<div class="loader"><div class="spinner"></div> Загрузка...</div>';
  try {
    let url = '/events';
    const params = [];
    if (activeCategory) params.push('category_id=' + activeCategory);
    if (search) params.push('search=' + encodeURIComponent(search));
    if (params.length) url += '?' + params.join('&');

    const events = await get(url);
    if (!events.length) { grid.innerHTML = '<div class="empty"><div class="empty-icon">🎭</div>События не найдены</div>'; return; }

    grid.innerHTML = events.map(e => `
      <div class="card event-card" onclick="location.href='event.html?id=${e.event_id}'">
        ${imgOrPlaceholder(e.image, '🎭')}
        <div class="card-body">
          <span class="card-tag">${e.category_name || 'Событие'}</span>
          <div class="card-title">${e.title}</div>
          <div class="card-meta">📅 ${fmtDate(e.start_datetime)}</div>
          <div class="card-meta">📍 ${e.venue_name || '—'}</div>
          <div class="card-price">${fmtPrice(e.price)}</div>
        </div>
        <div class="card-footer">
          <span class="badge badge-gray">${e.organization_name || ''}</span>
          <button class="fav-btn" onclick="event.stopPropagation(); addFav(${e.event_id}, null, this)" title="В избранное">♡</button>
        </div>
      </div>
    `).join('');
  } catch(e) { grid.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>' + e.message + '</div>'; }
}

async function loadVenues(search = '') {
  const grid = document.getElementById('venues-grid');
  grid.innerHTML = '<div class="loader"><div class="spinner"></div> Загрузка...</div>';
  try {
    let url = '/venues';
    const params = [];
    if (activeCategory) params.push('category_id=' + activeCategory);
    if (search) params.push('search=' + encodeURIComponent(search));
    if (params.length) url += '?' + params.join('&');

    const venues = await get(url);
    if (!venues.length) { grid.innerHTML = '<div class="empty"><div class="empty-icon">📍</div>Площадки не найдены</div>'; return; }

    grid.innerHTML = venues.map(v => `
      <div class="card event-card" onclick="location.href='venue.html?id=${v.venue_id}'">
        ${imgOrPlaceholder(v.image, '🏛️')}
        <div class="card-body">
          <span class="card-tag green">${v.category_name || 'Площадка'}</span>
          <div class="card-title">${v.name}</div>
          <div class="card-meta">📍 ${v.address || 'Адрес не указан'}</div>
          ${v.age ? `<div class="card-meta">🔞 ${v.age}+</div>` : ''}
        </div>
        <div class="card-footer">
          <span></span>
          <button class="fav-btn" onclick="event.stopPropagation(); addFav(null, ${v.venue_id}, this)" title="В избранное">♡</button>
        </div>
      </div>
    `).join('');
  } catch(e) { grid.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>' + e.message + '</div>'; }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-events').classList.toggle('active', tab === 'events');
  document.getElementById('tab-venues').classList.toggle('active', tab === 'venues');
  document.getElementById('events-grid').style.display = tab === 'events' ? '' : 'none';
  document.getElementById('venues-grid').style.display = tab === 'venues' ? '' : 'none';
  activeCategory = null;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  tab === 'events' ? loadEvents() : loadVenues();
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  const cat = document.getElementById('search-category').value;
  if (cat) activeCategory = cat;
  currentTab === 'events' ? loadEvents(q) : loadVenues(q);
}

async function addFav(eventId, venueId, btn) {
  if (!auth.isLoggedIn()) { toast('Войдите чтобы добавить в избранное', 'error'); return; }
  try {
    await post('/favorites', { event_id: eventId, venue_id: venueId });
    btn.classList.add('active'); btn.textContent = '♥';
    toast('Добавлено в избранное', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

init();
</script>
</body>
</html>
